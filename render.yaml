services:
  - type: web
    name: nexusflow-erp-crm-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:prod && npm run seed:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: nexusflow-erp-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: nexusflow-erp-crm-db
    databaseName: nexusflow
    user: nexusflow
