services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexusflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nexusflow
      JWT_SECRET: ${JWT_SECRET:-replace-this-for-any-non-local-deployment}
      CORS_ORIGIN: http://localhost:8080
    command: sh -c "npm run migrate:prod && npm run seed:prod && npm start"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
